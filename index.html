<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>Для тебя 💖</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a8edea);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            text-align: center;
            color: white;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-text-size-adjust: 100%;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: min(100% - 32px, 480px);
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 2.8em);
            line-height: 1.15;
            margin: 15px 0 8px;
        }

        h2 {
            font-size: clamp(1.2rem, 5vw, 1.7em);
            line-height: 1.25;
            margin: 10px 0 28px;
        }

        .cat-container {
            width: min(270px, 75vw);
            margin: 25px auto;
            animation: catBob 3s ease-in-out infinite;
        }

        @keyframes catBob {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-18px) rotate(5deg); }
        }

        .cat {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 32px;
            flex-wrap: wrap;
            position: relative;
            min-height: 64px;
        }

        button {
            padding: 16px 28px;
            font-size: clamp(1.05rem, 4.5vw, 1.5em);
            line-height: 1.2;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            min-width: 150px;
            max-width: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.97);
        }

        #yes {
            background: linear-gradient(45deg, #ff4d6d, #ff6b8a);
            color: white;
        }

        #no {
            background: #555;
            color: white;
            position: relative;
        }

        #dateInput,
        #timeInput {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 15px auto;
            padding: 14px;
            font-size: 1.1rem;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            -webkit-appearance: none;
            appearance: none;
        }

        .send-button {
            background: linear-gradient(45deg, #ff4d6d, #ff6b8a);
            color: white;
            padding: 18px 32px;
            font-size: clamp(1.1rem, 4.5vw, 1.5em);
            margin-top: 20px;
        }

        .heart {
            position: fixed;
            bottom: -50px;
            font-size: clamp(24px, 8vw, 32px);
            pointer-events: none;
            animation: floatHeart 4s linear forwards;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.3);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                width: min(100% - 24px, 480px);
                padding-top: 20px;
            }

            .cat-container {
                margin: 18px auto;
            }

            .buttons {
                gap: 12px;
                margin-top: 24px;
            }

            button {
                width: 100%;
                min-width: 0;
            }
        }

        @media (min-width: 768px) {
            .container {
                padding-top: 40px;
            }

            .buttons {
                gap: 25px;
            }

            button {
                padding: 18px 40px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="main-screen">
    <h1>Привет, красотка 💖</h1>
    <h2>Пойдёшь со мной гулять? 🥺</h2>
    
    <div class="cat-container">
        <img src="cat.png" class="cat">
    </div>

    <div class="buttons">
        <button id="yes">Дааа 😍</button>
        <button id="no">Нет 😅</button>
    </div>
</div>

<!-- Второй экран -->
<div class="container" id="second-screen" style="display: none;">
    <h1>Ты уверена? 😠</h1>
    <div class="cat-container">
        <img src="cat.png" class="cat">
    </div>
    <div class="buttons">
        <button onclick="goToDate()">Извини, я ошиблась😘</button>
        <button onclick="goToDate()">Извини, я ошиблась😘</button>
    </div>
</div>

<!-- Третий экран -->
<div class="container" id="third-screen" style="display: none;">
    <h1>Выбери дату и время 💕</h1>
    <div class="cat-container">
        <img src="cat.png" class="cat">
    </div>
    
    <input type="date" id="dateInput">
    <input type="time" id="timeInput">
    
    <button class="send-button" onclick="sendToTG()">
        Отправить ему 💌
    </button>
</div>

<script>
let noClickCount = 0;

document.getElementById('yes').addEventListener('click', function() {
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('third-screen').style.display = 'block';
});

document.getElementById('no').addEventListener('click', function() {
    noClickCount++;
    const btn = this;
    
    const maxX = window.innerWidth - 200;
    const maxY = window.innerHeight - 150;
    
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    
    btn.style.position = 'absolute';
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';

    if (noClickCount >= 5) {
        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('second-screen').style.display = 'block';
    }
});

function goToDate() {
    document.getElementById('second-screen').style.display = 'none';
    document.getElementById('third-screen').style.display = 'block';
}

function backToMain() {
    document.getElementById('second-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    noClickCount = 0;
}

function sendToTG() {
    const date = document.getElementById('dateInput').value;
    const time = document.getElementById('timeInput').value;
    if (!date || !time) {
        alert("Выбери дату и время ❤️");
        return;
    }
    const text = encodeURIComponent(`Я свободна ${date} в ${time} 💕 Хочу с тобой гулять!`);
    window.location.href = `https://t.me/bibirobdiller?text=${text}`;
}

// Сердечки
setInterval(() => {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '💖';
    heart.style.left = Math.random() * 100 + 'vw';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}, 500);

window.onload = () => {
    document.getElementById('dateInput').min = new Date().toISOString().split('T')[0];
};
</script>
</body>
</html>
